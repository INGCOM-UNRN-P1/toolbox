# Integración de punta a punta del ecosistema (N-ECO-03).
#
# Corre en un runner limpio, instala todas las herramientas DESDE GIT (como lo
# haría un estudiante o un docente, sin el monorepo local) y ejecuta:
#   - los tests de los propios scripts de verificación;
#   - la coherencia del manifiesto ecosistema.toml con los repositorios;
#   - los chequeos de documentación (instalación por nombre, comandos citados);
#   - los dos smoke tests estudiantiles con oráculos;
#   - las salidas --json de los analizadores contra la forma común de hallazgos;
#   - el doctor de cada herramienta (informativo);
#   - los enlaces de la documentación Markdown;
#   - el fuzz de subcomandos: ninguna entrada inválida termina en traceback.
#
# Además de cada push, corre todos los lunes: así los arreglos ya cerrados en
# el ledger de la revisión se vuelven a verificar periódicamente.
name: Ecosistema E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Tests de los scripts de verificación
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: pytest
        run: uvx pytest -q tests

  manifiesto-y-documentacion:
    name: Manifiesto y documentación
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validar ecosistema.toml
        run: python3 scripts/ecosistema.py listar --formato json > /dev/null

      - name: Clonar los repositorios del manifiesto
        run: bash scripts/clone_repos.sh --target "$RUNNER_TEMP/ecosistema"

      - name: Coherencia del manifiesto con los repositorios
        run: python3 scripts/ecosistema.py verificar --raiz "$RUNNER_TEMP/ecosistema"

      # Ola 11: la matriz del cuatrimestre sólo fija tags vX.Y.Z publicados o commits completos,
      # nunca una rama. `ecosistema.py listar` ya rechaza los valores mutables; mother además
      # comprueba en cada repo que el tag exista y que no haya una rama con ese nombre.
      - name: Matriz del cuatrimestre sin ramas mutables (mother auditar)
        run: |
          PYTHONPATH="$RUNNER_TEMP/ecosistema/mother/src" \
            python3 -m mother --manifiesto ecosistema.toml auditar --remoto

      - name: Instrucciones de instalación solo desde git
        run: python3 scripts/verificar_docs_instalacion.py --raiz "$RUNNER_TEMP/ecosistema"

      # apunte se excluye hasta corregir sus enlaces rotos (N-APUNTE-02).
      - name: Enlaces de la documentación
        run: python3 scripts/verificar_enlaces_md.py --raiz "$RUNNER_TEMP/ecosistema" --excluir apunte

  smoke-desde-git:
    name: Instalación desde git y smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb valgrind bubblewrap make

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      # Como lo instala un estudiante o un docente: mother desde git, con este manifiesto
      # (y la matriz de versiones del cuatrimestre vigente, si la hay).
      - name: Instalar todas las herramientas activas desde git (mother)
        run: |
          uvx --from git+https://github.com/INGCOM-UNRN-P1/mother mother --manifiesto ecosistema.toml instalar --todo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # health_check.sh delega en `mother doctor`. Informativo: en el runner faltan a propósito
      # componentes opcionales (libasan para tetsuo, zig para hardboiled…).
      - name: Doctor agregado (mother doctor, informativo)
        continue-on-error: true
        run: bash scripts/health_check.sh

      - name: Contrato de línea de comandos (-h, --version/-v, doctor --json)
        run: python3 scripts/verificar_contrato_cli.py

      - name: Smoke test estudiantil con oráculos (test_all_tools.sh)
        working-directory: student-smoke-test
        run: bash scripts/test_all_tools.sh

      - name: Smoke test integral (smoke_test.sh)
        working-directory: student-smoke-test
        run: bash smoke_test.sh

      # gaff, daedalus, tetsuo, ripley y hal: cada salida --json trae la lista plana «hallazgos»
      # con la forma común (archivo relativo, claves, severidades y categorías), la que lee jonesy.
      - name: Salidas JSON con la forma común de hallazgos (yutani.hallazgos)
        run: |
          uv run --no-project --with "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani" \
            python3 scripts/verificar_salidas_json.py

      - name: Comandos citados en skills y manuales
        run: python3 scripts/verificar_comandos_docs.py

      # La tabla de comandos y los requisitos de cada README se generan desde --help y
      # ecosistema.toml (N-ECO-09): falla si algún README quedó desactualizado.
      - name: Referencia generada de los README
        run: |
          bash scripts/clone_repos.sh --target "$RUNNER_TEMP/ecosistema"
          python3 scripts/readme_generado.py verificar --raiz "$RUNNER_TEMP/ecosistema"

  fuzz-subcomandos:
    name: Fuzz de subcomandos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb valgrind bubblewrap make

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Instalar todas las herramientas activas desde git (mother)
        run: |
          uvx --from git+https://github.com/INGCOM-UNRN-P1/mother mother --manifiesto ecosistema.toml instalar --todo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fuzz de subcomandos
        run: python3 scripts/fuzz_subcomandos.py --salida fuzz.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-subcomandos
          path: fuzz.json
